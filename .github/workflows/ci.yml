name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      install-command: npm install
      gate-commands: npm test

  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
